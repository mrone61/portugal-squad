<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Lengkap Portugal - World Cup 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- HEADER JADWAL -->
    <section class="schedule-header">
        <a href="index.html" class="back-btn">← Kembali ke Home</a>
        <h1>JADWAL LENGKAP GROUP K</h1>
        <p>Portugal FIFA World Cup 2026</p>
    </section>

    <!-- JADWAL MATCH 2 & 3 - JAM WIT -->
    <section class="section">
        <!-- MATCH 2 -->
        <div class="match-card-small">
            <div class="match-league-small">Matchday 2</div>
            <div class="match-date-small">Wed, 24 Jun 2026 • 02:00 WIT</div>
            <div class="match-teams-small">
                <span class="flag-small">🇵🇹Portugal</span>
                <span class="vs-small">vs</span>
                <span class="flag-small">🇺🇿Uzbekistan</span>
            </div>
            <div class="venue-small">NRG Stadium, Houston, Texas</div>
            <button class="match-live-btn-small" data-link="#">Segera</button>
        </div>

        <!-- MATCH 3 -->
        <div class="match-card-small">
            <div class="match-league-small">Matchday 3</div>
            <div class="match-date-small">Sun, 28 Jun 2026 • 08:30 WIT</div>
            <div class="match-teams-small">
                <span class="flag-small">🇨🇴Colombia</span>
                <span class="vs-small">vs</span>
                <span class="flag-small">🇵🇹Portugal</span>
            </div>
            <div class="venue-small">Hard Rock Stadium, Miami, Florida</div>
            <button class="match-live-btn-small" data-link="#">Segera</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
