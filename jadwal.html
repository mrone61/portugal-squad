<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Lengkap Portugal - World Cup 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- HEADER JADWAL -->
    <section class="schedule-header">
        <a href="index.html" class="back-btn">← Kembali ke Home</a>
        <h1>JADWAL LENGKAP GROUP K</h1>
        <p>Portugal FIFA World Cup 2026</p>
    </section>

    <!-- JADWAL MATCH 2 & 3 - STADION BENER -->
    <section class="section">
        <!-- MATCH 2 -->
        <div class="match-card-small">
            <div class="match-league-small">Matchday 2</div>
            <div class="match-date-small">Tue, 23 Jun 2026 • 01:00 PM ET</div>
            <div class="match-teams-small">
                <span class="flag-small">🇵🇹</span>
                <span class="vs-small">vs</span>
                <span class="flag-small">🇺🇿</span>
            </div>
            <div class="venue-small">NRG Stadium, Houston, Texas</div>
            <button class="match-live-btn-small" data-link="#">Link Segera</button>
        </div>

        <!-- MATCH 3 -->
        <div class="match-card-small">
            <div class="match-league-small">Matchday 3</div>
            <div class="match-date-small">Sat, 27 Jun 2026 • 07:30 PM ET</div>
            <div class="match-teams-small">
                <span class="flag-small">🇨🇴</span>
                <span class="vs-small">vs</span>
                <span class="flag-small">🇵🇹</span>
            </div>
            <div class="venue-small">Hard Rock Stadium, Miami, Florida</div>
            <button class="match-live-btn-small" data-link="#">Link Segera</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
